# Mechanical fixture gate, check-script case suite, and repository lint
# (openwashdata/pkgreview#72). The gate diffs the check script's report on the
# fixtures against fixtures/expected/; a changed FAIL, FLAG, or NOT RUN line
# fails here until the expected report is updated in the same change.
name: gate

on:
  push:
    branches: [main, dev]
  pull_request:
  workflow_dispatch:

jobs:
  fixture-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      # The check script takes its metadata, docs, and tests lines from
      # washr::check_publication_readiness() (openwashdata/pkgreview#87),
      # so washr at or above skills/pkgreview-core/WASHR_FLOOR is needed.
      # CRAN serves a washr below the floor until 1.2.0 is released there,
      # so washr comes from the dev branch on GitHub. Back to
      # install.packages("washr") once CRAN serves the floor.
      - name: Install washr from GitHub
        env:
          GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
        run: Rscript -e 'install.packages("pak"); pak::pak("openwashdata/washr@dev")'
      - name: Fixture gate against the expected reports
        run: bash fixtures/run_gate.sh
      - name: Check-script case suite
        run: bash fixtures/run_cases.sh

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Repository lint
        run: bash scripts/lint.sh
      - name: Newest tag matches VERSION (main only)
        if: github.ref == 'refs/heads/main'
        run: LINT_CHECK_TAG=1 bash scripts/lint.sh
